code-style:
  trigger: read before writing or reviewing code in any language
typescript:
  trigger: read before writing or reviewing TypeScript
linting:
  trigger: read before setting up or changing a linter or formatter
svelte:
  trigger: read before Svelte or SvelteKit work
docker:
  trigger: read before writing Dockerfiles or compose files, or debugging containers
git:
  trigger: read before rebasing, merging or rewriting git history
testing:
  trigger: read before writing tests or debugging a failing test
homelab:
  trigger: read before changing the home server, its network or its services
writing:
  trigger: read before writing docs, commit messages or other prose for the user
python:
  trigger: read before Python work or packaging
household:
  trigger: read before planning anything about the house, the garden or the people in it
